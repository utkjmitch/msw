<!doctype html><html lang="en"><head><title>Pay</title></head><body>
<h1>Card details</h1>
<form method="post" action="/pay">
<label for="cc">Card number</label><input id="cc" autocomplete="cc-number">
<label for="exp">Expiry</label><input id="exp" autocomplete="cc-exp">
<label for="csc">Security code</label><input id="csc" autocomplete="cc-csc">
<button type="submit">Pay</button></form>
</body></html>
